version: "3.8"

services:
  nexusrag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexusrag-enterprise-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NEXUSRAG_JWT_SECRET=${NEXUSRAG_JWT_SECRET:-nexusrag-soc2-production-key-change-me}
      - JWT_EXPIRE_SECONDS=86400
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - RATE_LIMIT_PER_MINUTE=300
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - nexusrag-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  nexusrag-data:
    driver: local
